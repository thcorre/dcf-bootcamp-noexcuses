name: dcf-${GROUP_ID} # short for streaming telemetry ;)
prefix: ""

mgmt:
  network: dcf-${GROUP_ID}
  ipv4-subnet: 172.80.${GROUP_ID}.0/24
  ipv6-subnet: 3fff:172:80:${GROUP_ID}::/64

topology:
  defaults:
    kind: nokia_srlinux

  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.10
      type: ixr-d2l
    linux:
      image: ghcr.io/srl-labs/network-multitool

  nodes:
    ### SPINES ###
    spine1:
      type: ixr-d3l
      group: spine
      startup-config: configs/fabric/spine1.cfg
      mgmt-ipv4: 172.80.${GROUP_ID}.21
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::21
    spine2:
      type: ixr-d3l
      group: spine
      startup-config: configs/fabric/spine2.cfg
      mgmt-ipv4: 172.80.${GROUP_ID}.22
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::22  

    ### LEAFS ###
    leaf1:
      startup-config: configs/fabric/leaf1.cfg
      mgmt-ipv4: 172.80.${GROUP_ID}.11
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::11
      group: leaf
    leaf2:
      startup-config: configs/fabric/leaf2.cfg
      mgmt-ipv4: 172.80.${GROUP_ID}.12
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::12
      group: leaf
    leaf3:
      startup-config: configs/fabric/leaf3.cfg
      mgmt-ipv4: 172.80.${GROUP_ID}.13
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::13
      group: leaf

    ### CLIENTS ###
    client1:
      kind: linux
      mgmt-ipv4: 172.80.${GROUP_ID}.31
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::31
      exec:
        - ip address add 172.17.0.1/24 dev eth1
        - ip -6 address add 2002::172:17:0:1/96 dev eth1
        - iperf3 -s -p 5201 -D > iperf3_1.log
        - iperf3 -s -p 5202 -D > iperf3_2.log
      group: server
    client2:
      kind: linux
      mgmt-ipv4: 172.80.${GROUP_ID}.32
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::32
      binds:
        - configs/client2:/config
      exec:
        - ip address add 172.17.0.2/24 dev eth1
        - ip -6 address add 2002::172:17:0:2/96 dev eth1
      group: server
    client3:
      kind: linux
      mgmt-ipv4: 172.80.${GROUP_ID}.33
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::33
      binds:
        - configs/client3:/config
      exec:
        - ip address add 172.17.0.3/24 dev eth1
        - ip -6 address add 2002::172:17:0:3/96 dev eth1
      group: server

    ### TELEMETRY STACK ###
    gnmic:
      kind: linux
      mgmt-ipv4: 172.80.${GROUP_ID}.41
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::41
      image: ghcr.io/openconfig/gnmic:0.45.0
      binds:
        - configs/gnmic/gnmic-config.yml:/gnmic-config.yml:ro
      cmd: --config /gnmic-config.yml --log subscribe
      group: "10" # group 10 is assigned to the nodes of a telemetry stack

    prometheus:
      kind: linux
      mgmt-ipv4: 172.80.${GROUP_ID}.42
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::42
      image: quay.io/prometheus/prometheus:v3.11.3
      binds:
        - configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      cmd: --config.file=/etc/prometheus/prometheus.yml
      ports:
        - 909${GROUP_ID}:9090
      group: "10"

    grafana:
      kind: linux
      mgmt-ipv4: 172.80.${GROUP_ID}.43
      mgmt-ipv6: 3fff:172:80:${GROUP_ID}::43
      image: grafana/grafana:13.0.1
      binds:
        - configs/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
        - configs/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
        - configs/grafana/dashboards:/var/lib/grafana/dashboards
      ports:
        - 300${GROUP_ID}:3000
      env:
        GF_INSTALL_PLUGINS: andrewbmchugh-flow-panel
        GF_ORG_ROLE: Admin
        GF_ORG_NAME: Main Org
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_ANONYMOUS: "true"
        GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      group: "10"

  links:
    - endpoints: [ "spine1:e1-1", "leaf1:e1-49" ]
    - endpoints: [ "spine1:e1-2", "leaf2:e1-49" ]
    - endpoints: [ "spine1:e1-3", "leaf3:e1-49" ]
    - endpoints: [ "spine2:e1-1", "leaf1:e1-50" ]
    - endpoints: [ "spine2:e1-2", "leaf2:e1-50" ]
    - endpoints: [ "spine2:e1-3", "leaf3:e1-50" ]
    - endpoints: [ "leaf1:e1-1", "client1:eth1" ]
    - endpoints: [ "leaf2:e1-1", "client2:eth1" ]
    - endpoints: [ "leaf3:e1-1", "client3:eth1" ]
